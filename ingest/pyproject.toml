[project]
name = "accio-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf4llm",
    "markitdown[docx,pptx,xlsx]",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "Pillow",
    "pillow-heif",
    "mlx-vlm",
    "mlx-embeddings",
    "mlx-lm",
    "pyyaml",
    "ctranslate2>=4.9.1",
    "sentencepiece>=0.2.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
accio-ingest = "accio_ingest.cli:main"

[dependency-groups]
dev = ["pytest", "python-docx", "python-pptx", "openpyxl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: downloads and runs real models"]
