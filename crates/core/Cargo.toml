[package]
name = "accio-core"
version = "0.1.0"
edition = "2024"

[features]
testutil = []

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
dotenvy = "0.15"
base64 = "0.22"
futures-util = "0.3"
globset = "0.4"
half = "2"
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
